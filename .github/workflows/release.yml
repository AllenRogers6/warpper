name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" || python -m pip install -e .
          python -m pip install pytest pytest-asyncio

      - name: Check tag matches pyproject version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          pyver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag:       $tag"
          echo "pyproject: $pyver"
          if [ "$tag" != "$pyver" ]; then
            echo "::error::tag ($tag) does not match pyproject version ($pyver)"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: python -m pytest tests/ -v

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pyinstaller .
          python -m pip install -e .

      - name: Build wheel
        run: python -m build --wheel

      - name: Build standalone binaries
        run: |
          pyinstaller --onefile --name warpperd   warpperd.py
          pyinstaller --onefile --name warpperctl cli/warpperctl.py

      - name: Package binaries as tarball
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/warpperd dist/warpperctl release/
          chmod +x release/warpperd release/warpperctl
          tar -czf "release/warpper-${VERSION}-linux-x86_64.tar.gz" \
            -C release warpperd warpperctl

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: release/*.tar.gz
          if-no-files-found: error

  github-release:
    name: Attach assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: release/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            release/*.tar.gz
