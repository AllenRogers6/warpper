[general]
sinkhole_ip = 0.0.0.0
upstream_dns = 1.1.1.1,8.8.8.8
enable_proxy = false
enable_firewall = false
db_path = /var/lib/warpper/warpper.db
log_level = info

[proxy]
listen_host = 127.0.0.1
listen_port = 15353
ca_cert_path = /var/lib/warpper/certs

[firewall]
nft_family = inet
nft_table = warpper
block_set = blocked_ips
