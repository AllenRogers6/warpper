[project]
name = "warpper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography", "dnslib", "psutil"]

[project.scripts]
warpperctl = "cli.warpperctl:main"
warpperd = "warpperd:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["warpperd"]
packages = ["modules", "cli"]
