[project]
name = "warpper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography", "dnslib", "psutil"]

[project.scripts]
warpperctl = "cli.warpperctl:main"
warpperd = "warpperd:cli"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--ignore=tests/integration --ignore=tests/pkg"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
py-modules = ["warpperd"]
packages = ["modules", "cli"]
